<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .red { fill: #e31e24; }
      .blue { fill: #0a2d87; }
      .bg { fill: #ffffff; }
    </style>
  </defs>
  <rect class="bg" width="512" height="512" rx="96" ry="96"/>
  <!-- Outer red brackets -->
  <rect class="red" x="48" y="48" width="144" height="96"/>
  <rect class="red" x="48" y="368" width="144" height="96"/>
  <rect class="red" x="320" y="48" width="144" height="96"/>
  <rect class="red" x="320" y="368" width="144" height="96"/>
  <!-- White cutouts to form bracket shape -->
  <rect class="bg" x="112" y="96" width="80" height="80"/>
  <rect class="bg" x="112" y="336" width="80" height="80"/>
  <rect class="bg" x="320" y="96" width="80" height="80"/>
  <rect class="bg" x="320" y="336" width="80" height="80"/>
  <!-- Center blue square -->
  <rect class="blue" x="176" y="176" width="160" height="160" rx="16" ry="16"/>
</svg>


